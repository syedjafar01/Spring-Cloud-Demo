spring.application.name=consumer-service
server.port=${SERVER_PORT:8083}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=false

resilience4j.circuitbreaker.instances.greeting-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.greeting-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.greeting-service.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.greeting-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.greeting-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.greeting-service.permitted-number-of-calls-in-half-open-state=2

resilience4j.retry.instances.greeting-service.max-attempts=3
resilience4j.retry.instances.greeting-service.wait-duration=200ms
resilience4j.retry.instances.greeting-service.retry-exceptions=org.springframework.web.client.RestClientException

management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
