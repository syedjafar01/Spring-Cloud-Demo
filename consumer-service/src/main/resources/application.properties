spring.application.name=consumer-service
server.port=${SERVER_PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=false

resilience4j.circuitbreaker.instances.service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.service.sliding-window-size=5
resilience4j.circuitbreaker.instances.service.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.service.permitted-number-of-calls-in-half-open-state=2

resilience4j.retry.instances.service.max-attempts=3
resilience4j.retry.instances.service.wait-duration=200ms
resilience4j.retry.instances.service.retry-exceptions=org.springframework.web.client.RestClientException

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
