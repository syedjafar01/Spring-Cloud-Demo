services:
  discovery-server:
    build:
      context: .
      args:
        MODULE: discovery-service
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10

  service-1:
    build:
      context: .
      args:
        MODULE: application-server
    container_name: service-1
    environment:
      SERVER_PORT: 8081
      SERVICE_INSTANCE_NAME: instance-1
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy

  service-2:
    build:
      context: .
      args:
        MODULE: application-server
    container_name: service-2
    environment:
      SERVER_PORT: 8082
      SERVICE_INSTANCE_NAME: instance-2
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy

  client:
    build:
      context: .
      args:
        MODULE: application-client
    container_name: application-client
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy
      service-1:
        condition: service_started
      service-2:
        condition: service_started
