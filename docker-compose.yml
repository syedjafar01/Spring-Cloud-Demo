services:
  discovery-server:
    build:
      context: .
      args:
        MODULE: discovery-service
    container_name: discovery-server
    ports:
      - "8761:8761"

  greeting-service-1:
    build:
      context: .
      args:
        MODULE: greeting-service
    container_name: greeting-service-1
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SERVICE_INSTANCE_NAME: instance-1
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      - discovery-server

  greeting-service-2:
    build:
      context: .
      args:
        MODULE: greeting-service
    container_name: greeting-service-2
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SERVICE_INSTANCE_NAME: instance-2
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      - discovery-server

  consumer:
    build:
      context: .
      args:
        MODULE: consumer-service
    container_name: consumer-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      - discovery-server
      - greeting-service-1
      - greeting-service-2

  gateway:
    build:
      context: .
      args:
        MODULE: gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      - discovery-server
      - greeting-service-1
      - greeting-service-2

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway
      - consumer
      - greeting-service-1
      - greeting-service-2

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
