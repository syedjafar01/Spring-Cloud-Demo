services:
  discovery-server:
    build:
      context: .
      args:
        MODULE: discovery-service
    container_name: discovery-server
    ports:
      - "8761:8761"

  service-1:
    build:
      context: .
      args:
        MODULE: application-server
    container_name: service-1
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SERVICE_INSTANCE_NAME: instance-1
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      - discovery-server

  service-2:
    build:
      context: .
      args:
        MODULE: application-server
    container_name: service-2
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SERVICE_INSTANCE_NAME: instance-2
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      - discovery-server

  client:
    build:
      context: .
      args:
        MODULE: application-client
    container_name: application-client
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
    depends_on:
      - discovery-server
      - service-1
      - service-2
