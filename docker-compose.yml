services:
  discovery-server:
    build:
      context: .
      args:
        MODULE: discovery-service
    container_name: discovery-server
    ports:
      - "8761:8761"

  greeting-service-1:
    build:
      context: .
      args:
        MODULE: greeting-service
    container_name: greeting-service-1
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SERVICE_INSTANCE_NAME: instance-1
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      - discovery-server
      - tempo

  greeting-service-2:
    build:
      context: .
      args:
        MODULE: greeting-service
    container_name: greeting-service-2
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SERVICE_INSTANCE_NAME: instance-2
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      - discovery-server
      - tempo

  consumer:
    build:
      context: .
      args:
        MODULE: consumer-service
    container_name: consumer-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      - discovery-server
      - greeting-service-1
      - greeting-service-2
      - tempo

  gateway:
    build:
      context: .
      args:
        MODULE: gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      - discovery-server
      - greeting-service-1
      - greeting-service-2
      - tempo

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway
      - consumer
      - greeting-service-1
      - greeting-service-2

  tempo:
    image: grafana/tempo:3.0.2
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.7.2
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  tempo-data:
  loki-data:
  alloy-data:
