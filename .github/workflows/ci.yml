name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Maven build
        run: mvn --batch-mode --no-transfer-progress clean verify

  docker-build:
    name: Validate Docker images
    runs-on: ubuntu-latest
    needs: verify

    strategy:
      fail-fast: false
      matrix:
        module:
          - discovery-service
          - greeting-service
          - consumer-service
          - gateway-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg MODULE=${{ matrix.module }} --tag spring-cloud-reference:${{ matrix.module }} .
