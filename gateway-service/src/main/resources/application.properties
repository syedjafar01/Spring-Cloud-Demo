spring.application.name=gateway-service
server.port=${SERVER_PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true

spring.cloud.gateway.routes[0].id=greeting-service
spring.cloud.gateway.routes[0].uri=lb://greeting-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.correlation=[trace_id=%X{traceId:-},span_id=%X{spanId:-}] 
